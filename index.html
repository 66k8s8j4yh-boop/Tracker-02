<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#7b4dff">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mu:#777;--ac:#3b6cf6;--bd:#e5e3dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e21;--tx:#f2f2f2;--mu:#999;--ac:#7c9bff;--bd:#2d2d31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e21;--tx:#f2f2f2;--mu:#999;--ac:#7c9bff;--bd:#2d2d31;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;margin:auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:22px}
.ctl input{flex:1;min-width:0;height:44px;text-align:center;font-size:20px;font-weight:600;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input,select{font:inherit;color:var(--tx)}
.f{display:flex;flex-direction:column;gap:8px}
.f input,.f select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600}
.x{background:none;border:0;color:var(--mu);font-size:13px}
.dn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dn button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.dn input{border:0;background:none;font-weight:700;font-size:17px;text-align:center}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.st div{background:var(--bg);border-radius:10px;padding:7px 4px;text-align:center}
.st b{display:block;font-size:17px}
svg{width:100%;height:auto;display:block}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.seg button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.note{font-size:14px;padding:6px 0;border-bottom:1px solid var(--bd)}.note:last-child{border:0}.mb{flex:1;height:48px;font-size:24px;border-radius:12px;border:1px solid var(--bd);background:var(--bg)}.mb.on{border-color:var(--ac);background:var(--ac)}
</style></head><body>
<h1>📊 Mein Tracker</h1>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Eintragen</button><button id="t2" onclick="tab(2)">Statistik</button></div>
<div id="v1"></div><div id="v2" hidden></div>
<script>
const DEF=[{id:'sleep',name:'Schlaf',icon:'😴',unit:'h',step:0.5},{id:'caf',name:'Koffein',icon:'☕',unit:'Tassen',step:1,calc:{mg:80}},{id:'soda',name:'Süßgetränke',icon:'🥤',unit:'Gläser',step:1,calc:{ml:250,sugar:9}},{id:'m',name:'Masturbation',icon:'🔒',unit:'mal',step:1},{id:'mood',name:'Tagesgefühl',icon:'🙂',unit:'1–5',step:1,type:'mood'}];
let S={metrics:DEF,entries:{}},day=iso(new Date()),range=7;
try{const r=localStorage.getItem('tracker2');if(r)S=JSON.parse(r)}catch(e){}
(function(){const c=S.metrics.find(m=>m.id=='caf'),s=S.metrics.find(m=>m.id=='soda');if(c&&!c.calc)c.calc={mg:80};if(s&&!s.calc){s.calc={ml:250,sugar:9};if(s.unit=='Stück')s.unit='Gläser'}if(!S.metrics.find(m=>m.id=='mood'))S.metrics.push({id:'mood',name:'Tagesgefühl',icon:'🙂',unit:'1–5',step:1,type:'mood'})})();
function save(){try{localStorage.setItem('tracker2',JSON.stringify(S))}catch(e){}}
function iso(d){const o=d.getTimezoneOffset()*6e4;return new Date(d-o).toISOString().slice(0,10)}
function shift(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
function fmt(n){return Math.round(n*10)/10}
function tab(n){v1.hidden=n!=1;v2.hidden=n!=2;t1.className=n==1?'on':'';t2.className=n==2?'on':'';n==1?r1():r2()}
function val(id,d){const e=S.entries[d];return e&&e[id]!==undefined?e[id]:null}
function set(id,v){const e=S.entries[day]||(S.entries[day]={});if(v===''||v===null||isNaN(v))delete e[id];else e[id]=Math.max(0,fmt(v));save();r1()}
function chg(id,s){set(id,(val(id,day)||0)+s)}
function go(n){day=shift(day,n);r1()}
function r1(){
 v1.innerHTML=`<div class="dn"><button onclick="go(-1)">‹</button><input type="date" value="${day}" onchange="day=this.value||day;r1()"><button onclick="go(1)">›</button></div>`+
 S.metrics.map(m=>{const v=val(m.id,day);if(m.type=='mood')return moodCard(m,v);return `<div class="card"><div class="row sp"><b>${m.icon} ${m.name}</b><span class="mu">${m.unit}${v!==null&&m.calc?' · ('+extra(m,v)+')':''}</span></div><div class="ctl"><button onclick="chg('${m.id}',-${m.step})">−</button><input type="number" inputmode="decimal" step="${m.step}" placeholder="–" value="${v===null?'':v}" onchange="set('${m.id}',this.value===''?'':+this.value)"><button onclick="chg('${m.id}',${m.step})">+</button></div></div>`}).join('')+
 `<div class="card"><b>➕ Eigenes Feld hinzufügen</b><div class="f" style="margin-top:10px"><input id="nn" placeholder="Name (z. B. Wasser, Sport)"><div class="row"><input id="ni" placeholder="Emoji" maxlength="2" style="width:70px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)"><input id="nu" placeholder="Einheit (z. B. Glas, min)" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)"></div><button class="btn" onclick="addM()">Hinzufügen</button></div></div>`+
 `<div class="card"><div class="mu">Felder entfernen:</div>${S.metrics.map(m=>`<button class="x" onclick="delM('${m.id}')">${m.icon} ${m.name} ✕</button>`).join(' ')}<br><button class="x" onclick="cfg()">⚙️ Umrechnung anpassen</button><br><button class="x" onclick="exp()">⬇️ Daten exportieren (JSON)</button></div>`}
function addM(){const n=nn.value.trim();if(!n)return;S.metrics.push({id:'c'+Date.now(),name:n,icon:ni.value||'🔹',unit:nu.value||'x',step:1});save();r1()}
function delM(id){if(confirm('Feld und seine Daten wirklich löschen?')){S.metrics=S.metrics.filter(m=>m.id!=id);save();r1()}}
const MOODS=['😣','🙁','😐','🙂','😄'],MT=['sehr schlecht','schlecht','okay','gut','sehr gut'];
function extra(m,v){if(v===null||!m.calc)return '';if(m.calc.mg)return `≈ ${fmt(v*m.calc.mg)} mg Koffein`;if(m.calc.ml)return `≈ ${fmt(v*m.calc.ml*m.calc.sugar/100)} g Zucker`;return ''}
function moodCard(m,v){return `<div class="card"><div class="row sp"><b>${m.icon} ${m.name}</b><span class="mu">${v?MT[v-1]:'1 = schlecht · 5 = super'}</span></div><div class="row" style="margin-top:10px;gap:6px">${MOODS.map((e,i)=>`<button class="mb${v==i+1?' on':''}" onclick="set('${m.id}',${v==i+1?"''":i+1})">${e}</button>`).join('')}</div></div>`}
function cfg(){const c=S.metrics.find(m=>m.id=='caf'),s=S.metrics.find(m=>m.id=='soda');if(c){const a=prompt('Koffein (mg) pro Tasse:',c.calc.mg);if(a&&!isNaN(+a))c.calc.mg=+a}if(s){const b=prompt('Milliliter pro Glas:',s.calc.ml);if(b&&!isNaN(+b))s.calc.ml=+b;const g=prompt('Zucker (g) pro 100 ml:',s.calc.sugar);if(g&&!isNaN(+g))s.calc.sugar=+g}save();r1()}
function exp(){const t=JSON.stringify(S,null,1);navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Daten in die Zwischenablage kopiert.')).catch(()=>prompt('Kopiere:',t))}
function days(){const a=[];for(let i=range-1;i>=0;i--)a.push(shift(iso(new Date()),-i));return a}
function corr(x,y){const n=x.length;if(n<5)return null;const mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;let sx=0,sy=0,sxy=0;for(let i=0;i<n;i++){sx+=(x[i]-mx)**2;sy+=(y[i]-my)**2;sxy+=(x[i]-mx)*(y[i]-my)}return sx&&sy?sxy/Math.sqrt(sx*sy):null}
function chart(m,ds){const vs=ds.map(d=>val(m.id,d)),mx=m.type=='mood'?5:Math.max(1,...vs.map(v=>v||0)),W=300,H=90,bw=W/ds.length;
 let s=`<svg viewBox="0 0 ${W} ${H+16}">`;
 vs.forEach((v,i)=>{const h=v?v/mx*H:0;s+=`<rect x="${i*bw+1}" y="${H-h}" width="${Math.max(1,bw-2)}" height="${h}" rx="2" fill="${v===null?'none':'var(--ac)'}"/>`;if(v===null)s+=`<rect x="${i*bw+1}" y="${H-2}" width="${Math.max(1,bw-2)}" height="2" fill="var(--bd)"/>`});
 const lab=(i)=>{const d=ds[i].slice(8)+'.'+ds[i].slice(5,7)+'.';return `<text x="${i*bw}" y="${H+13}" font-size="9" fill="var(--mu)">${d}</text>`};
 s+=lab(0)+`<text x="${W}" y="${H+13}" font-size="9" fill="var(--mu)" text-anchor="end">${ds[ds.length-1].slice(8)}.${ds[ds.length-1].slice(5,7)}.</text></svg>`;return s}
function r2(){const ds=days();
 let h=`<div class="seg">${[7,30,90].map(n=>`<button class="${n==range?'on':''}" onclick="range=${n};r2()">${n} Tage</button>`).join('')}</div>`;
 h+=S.metrics.map(m=>{const vs=ds.map(d=>val(m.id,d)).filter(v=>v!==null),sum=vs.reduce((a,b)=>a+b,0);
  return `<div class="card"><b>${m.icon} ${m.name}</b> <span class="mu">(${m.unit})</span><div class="st"><div><b>${vs.length?fmt(sum/vs.length):'–'}</b><span class="mu">Ø/Tag</span></div><div><b>${fmt(sum)}</b><span class="mu">Summe</span></div><div><b>${vs.length?Math.max(...vs):'–'}</b><span class="mu">Max</span></div><div><b>${vs.length}</b><span class="mu">Tage</span></div></div>${m.calc&&vs.length?`<div class="mu">Ø pro Tag (${extra(m,sum/vs.length)}) · gesamt (${extra(m,sum)})</div>`:''}${chart(m,ds)}</div>`}).join('');
 const sl=S.metrics[0];let notes=[];
 if(sl)S.metrics.slice(1).forEach(m=>{const x=[],y=[];Object.keys(S.entries).forEach(d=>{const a=val(sl.id,d),b=val(m.id,d);if(a!==null&&b!==null){x.push(a);y.push(b)}});const c=corr(x,y);if(c!==null&&Math.abs(c)>=0.3)notes.push(`${m.icon} ${m.name} ↔ ${sl.icon} ${sl.name}: ${c>0?'tendenziell mehr':'tendenziell weniger'} ${sl.name} bei mehr ${m.name} (r = ${fmt(c*100)/100}, ${x.length} Tage)`)});
 h+=`<div class="card"><b>🔍 Zusammenhänge</b><div style="margin-top:6px">${notes.length?notes.map(n=>`<div class="note">${n}</div>`).join(''):'<span class="mu">Noch keine auffälligen Zusammenhänge – trag mindestens 5 Tage ein.</span>'}</div><div class="mu" style="margin-top:6px">Hinweis: Korrelation ist nicht gleich Ursache.</div></div>`;
 v2.innerHTML=h}
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#7b4dff');g.addColorStop(1,'#22b8ff');x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle='#fff';[[26,45],[56,75],[86,58],[116,100]].forEach(([px,h],i)=>{x.globalAlpha=i==3?1:.78;const y=152-h;x.beginPath();x.moveTo(px,152);x.lineTo(px,y+8);x.arc(px+11,y+8,11,Math.PI,0);x.lineTo(px+22,152);x.closePath();x.fill()});x.globalAlpha=1;x.beginPath();x.arc(48,44,13,0,7);x.fill();const u=c.toDataURL('image/png');['apple-touch-icon','icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)});const m=document.createElement('meta');m.name='apple-mobile-web-app-title';m.content='Tracker';document.head.appendChild(m)}catch(e){}})();
r1();
</script></body></html>
